<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 156" width="320" height="156">
  <!-- Background: subtle gradient azul-plateado -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#173F7B;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#4A90D9;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B0C4DE;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0C4DE;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#A0B8CF;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Stars row (3 stars, silver) -->
  <g transform="translate(160,24)" text-anchor="middle">
    <!-- Star 1 -->
    <polygon points="0,-14 4,-5 13,-5 6,2 8,12 0,6 -8,12 -6,2 -13,-5 -4,-5" fill="url(#starGrad)" stroke="#D4E4F1" stroke-width="0.8"/>
    <!-- Star 2 -->
    <polygon points="-40,-14 -36,-5 -27,-5 -34,2 -32,12 -40,6 -48,12 -46,2 -53,-5 -44,-5" fill="url(#starGrad)" stroke="#D4E4F1" stroke-width="0.8"/>
    <!-- Star 3 -->
    <polygon points="40,-14 44,-5 53,-5 46,2 48,12 40,6 32,12 34,2 27,-5 36,-5" fill="url(#starGrad)" stroke="#D4E4F1" stroke-width="0.8"/>
  </g>

  <!-- Main brand name: HOTEL -->
  <text x="160" y="68" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="22" fill="#173F7B" letter-spacing="8" font-weight="400">HOTEL</text>

  <!-- Brand name: PUNO TERRA -->
  <text x="160" y="106" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="42" fill="url(#logoGrad)" letter-spacing="4" font-weight="700">PUNO TERRA</text>

  <!-- Decorative line -->
  <line x1="60" y1="120" x2="260" y2="120" stroke="#4A90D9" stroke-width="1.5" opacity="0.6"/>

  <!-- Tagline -->
  <text x="160" y="142" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="11" fill="#B0C4DE" letter-spacing="3" font-weight="300">★★★ TARAPOTO</text>
</svg>